apiVersion: apps/v1
kind: Deployment
metadata:
  name: aether-backend
  namespace: aether-be
  labels:
    app: aether-backend
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aether-backend
  template:
    metadata:
      labels:
        app: aether-backend
        component: api
    spec:
      # Spread replicas across nodes (cluster gained pinova01 2026-09-21).
      # Safe since the cluster LAN went in: measured 2026-09-21, 3,703
      # sequential Postgres connects in 10s from the other node vs 3,793
      # locally -- a 2.4% penalty. Over WiFi it was ~70ms per round trip.
      #
      # topologySpreadConstraints, not podAntiAffinity: a `preferred`
      # anti-affinity was measured putting both replicas on the SAME node.
      # A rollout alone may still co-locate them, because each replacement is
      # scheduled while the pod it replaces still counts -- check placement
      # afterwards and delete one pod to rebalance.
      #
      # ScheduleAnyway, not DoNotSchedule: with two nodes a hard constraint
      # leaves a replica Pending whenever one node is down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: aether-backend
      serviceAccountName: aether-backend
      # The image runs as uid/gid 1001 (Dockerfile USER aether). fsGroup makes
      # the mounted delegate-token Secret group-readable by it (mode 0440);
      # there are no other volumes.
      securityContext:
        fsGroup: 1001
      containers:
      - name: aether-backend
        image: ghcr.io/tributary-ai-services/aether-be:main-d216a6c@sha256:fc3a6b1054ed164d4738d6c43fc596b9631d517d31ac59caa94edea10fd0abdb
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: aether-backend-config
        - secretRef:
            name: aether-backend-secret
        # /internal/v1 shared secret (Plan #22 2.1/2.2: aiqg-dashboard-be's
        # org link check and team-history sync). Optional: without it the
        # internal API is simply not mounted.
        - secretRef:
            name: aether-internal-auth
            optional: true
        # Plan #22 C.6 / AIQG-88: the delegate credential for the tas-mcp proxy's
        # delegated listener, read from a file so rotation needs no restart.
        # Unused until AETHER_MCP_VIA_PROXY is on (configmap.yaml). Secret
        # created by hand 2026-11-24 (same value as
        # tas-mcp-prod/tas-mcp-delegate-token), value in aether-secrets.
        env:
        - name: AETHER_MCP_DELEGATE_TOKEN_FILE
          value: /etc/aether/mcp-delegate/token
        volumeMounts:
        - name: mcp-delegate-token
          mountPath: /etc/aether/mcp-delegate
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: mcp-delegate-token
        secret:
          secretName: aether-mcp-delegate-token
          defaultMode: 0440
