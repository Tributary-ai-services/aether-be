# EXAMPLE ONLY - this file is NOT applied.
#
# It is deliberately absent from kustomization.yaml. Two reasons, both learned
# the hard way:
#
#  1. It used to carry LIVE credentials in a PUBLIC repository (see SEC-29).
#  2. `kubectl apply -k` overwrites the live Secret with whatever is here, so a
#     placeholder or an empty string silently breaks production. That is exactly
#     how REDIS_PASSWORD came to be empty: this file declared `REDIS_PASSWORD: ""`
#     with the comment "shared Redis has no auth", which stopped being true when
#     SEC-24 put a password on redis-shared on 2026-09-18. aether-backend then
#     logged `NOAUTH Authentication required.` on every boot and disabled podcast
#     progress tracking, and nothing reported it because the key was *present*.
#
# The live Secret is managed out of band. To create it on a fresh cluster, copy
# this file, fill in real values, and apply it directly with `kubectl apply -f`
# — never add it back to kustomization.yaml.
#
# TRADE-OFF, stated plainly: the Deployment's envFrom references this Secret with
# optional: false, so on a clean cluster `apply -k` alone leaves the pods in
# CreateContainerConfigError until you apply this file by hand. That is deliberate
# — a missing Secret fails loudly at startup, whereas the placeholder-in-git
# approach failed silently and stayed broken for five days.
#
# REDIS_PASSWORD must match tas-shared/redis-shared-auth:
#   kubectl get secret redis-shared-auth -n tas-shared -o jsonpath='{.data.password}'
#
apiVersion: v1
kind: Secret
metadata:
  name: aether-backend-secret
  namespace: aether-be
  labels:
    app: aether-backend
type: Opaque
stringData:
  # Neo4j Credentials
  NEO4J_USERNAME: "REPLACE_ME"
  NEO4J_PASSWORD: "REPLACE_ME"

  # Redis Password - MUST match tas-shared/redis-shared-auth. Never "".
  REDIS_PASSWORD: "REPLACE_ME"

  # Keycloak Client Secret
  KEYCLOAK_CLIENT_SECRET: "REPLACE_ME"

  # MinIO/S3 Credentials
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"

  # Router API Key (if needed)
  ROUTER_API_KEY: "REPLACE_ME"

  # AudiModal API Key
  AUDIMODAL_API_KEY: "REPLACE_ME"

  # DeepLake API Key
  DEEPLAKE_API_KEY: "REPLACE_ME"
