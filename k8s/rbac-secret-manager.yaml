# RBAC for aether-backend to manage database credential secrets
# in the tas-mcp-servers namespace (used by Neo4jQueryService)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aether-backend-secret-manager
  namespace: tas-mcp-servers
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aether-backend-secret-manager
  namespace: tas-mcp-servers
subjects:
- kind: ServiceAccount
  name: aether-backend
  namespace: aether-be
roleRef:
  kind: Role
  name: aether-backend-secret-manager
  apiGroup: rbac.authorization.k8s.io
